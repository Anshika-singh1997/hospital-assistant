<!DOCTYPE html>
<html>
<head>
  <title>USSD Simulator - *555#</title>
  <style>
    body { font-family: Arial; background: #1B5E20; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .phone {
      background: #1a1a1a;
      border-radius: 30px;
      padding: 20px;
      width: 280px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .screen {
      background: #c8e6c9;
      border-radius: 10px;
      padding: 15px;
      min-height: 200px;
      font-size: 13px;
      color: #1a1a1a;
      white-space: pre-line;
      margin-bottom: 15px;
    }
    .dial-code {
      background: #2E7D32;
      color: white;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .key {
      background: #333;
      color: white;
      border: none;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      font-size: 18px;
      cursor: pointer;
      margin: auto;
    }
    .key:hover { background: #43A047; }
    .key.call { background: #2E7D32; }
    .key.clear { background: #C62828; font-size: 12px; }
    h3 { color: white; text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>
<div>
  <h3>📱 USSD Simulator — Dial *555#</h3>
  <div style="text-align:center; margin-bottom: 15px;">
  <a href="/" style="
    background: #2E7D32;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
  ">🎤 Go Back to Voice Assistant</a>
</div>
  <div class="phone">
    <div class="dial-code">*555#</div>
    <div class="screen" id="screen">Press CALL to start</div>
    <div class="keypad">
      <button class="key" onclick="press('1')">1</button>
      <button class="key" onclick="press('2')">2</button>
      <button class="key" onclick="press('3')">3</button>
      <button class="key" onclick="press('4')">4</button>
      <button class="key" onclick="press('5')">5</button>
      <button class="key" onclick="press('6')">6</button>
      <button class="key" onclick="press('7')">7</button>
      <button class="key" onclick="press('8')">8</button>
      <button class="key" onclick="press('9')">9</button>
      <button class="key clear" onclick="reset()">CLR</button>
      <button class="key" onclick="press('0')">0</button>
      <button class="key call" onclick="startUSSD()">📞</button>
    </div>
  </div>
</div>

<script>
  let currentText = "";
  let started = false;

  function startUSSD() {
    currentText = "";
    started = true;
    fetchUSSD();
  }

  function press(num) {
    if (!started) {
      document.getElementById("screen").innerText = "Press 📞 to start first!";
      return;
    }
    if (currentText === "") {
      currentText = num;
    } else {
      currentText += "*" + num;
    }
    fetchUSSD();
  }

  function reset() {
    currentText = "";
    started = false;
    document.getElementById("screen").innerText = "Press CALL to start";
  }

  function fetchUSSD() {
    fetch(`/ussd?text=${currentText}`)
      .then(res => res.text())
      .then(data => {
        let display = data.replace("CON ", "").replace("END ", "");
        document.getElementById("screen").innerText = display;
        if (data.startsWith("END")) {
          started = false;
          currentText = "";
        }
      });
  }
</script>
</body>
</html>
