<!DOCTYPE html>

    body { font-family: Arial; background: #1B5E20; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; }
    .phone {
      background: #1a1a1a;
      border-radius: 30px;
      padding: 20px;
      width: 280px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .screen {
      background: #c8e6c9;
      border-radius: 10px;
      padding: 15px;
      min-height: 200px;
      font-size: 13px;
      color: #1a1a1a;
      white-space: pre-line;
      margin-bottom: 15px;
    }
    .dial-code {
      background: #2E7D32;
      color: white;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .key {
      background: #333;
      color: white;
      border: none;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      font-size: 18px;
      cursor: pointer;
      margin: auto;
    }
    .key:hover { background: #43A047; }
    .key.call { background: #2E7D32; }
    .key.clear { background: #C62828; font-size: 12px; }
    h3 { color: white; text-align: center; margin-bottom: 15px; }
  </style>

      border-radius: 20px;

      font-size: 13px;

  <div class="phone">

    <div class="screen" id="screen">Press 📞 to start</div>
    <div class="keypad">
      <button class="key" onclick="press('1')">1</button>
      <button class="key" onclick="press('2')">2</button>
      <button class="key" onclick="press('3')">3</button>
      <button class="key" onclick="press('4')">4</button>
      <button class="key" onclick="press('5')">5</button>
      <button class="key" onclick="press('6')">6</button>
      <button class="key" onclick="press('7')">7</button>
      <button class="key" onclick="press('8')">8</button>
      <button class="key" onclick="press('9')">9</button>
      <button class="key clear" onclick="reset()">CLR</button>
      <button class="key" onclick="press('0')">0</button>
      <button class="key call" onclick="startUSSD()">📞</button>
    </div>
  </div>

      "2": "CON డాక్టర్ ఎంచుకోండి:\n1. డా. రమేష్ కుమార్ - సాధారణ వైద్యుడు\n2. డా. ప్రియా శర్మ - స్త్రీరోగ\n3. డా. సురేష్ రావు - ఎముక నిపుణుడు\n4. డా. అనితా సింగ్ - శిశు వైద్యుడు\n5. డా. వినోద్ పటేల్ - హృదయ నిపుణుడు",
      "2*1": "END డా. రమేష్ కుమార్ - OPD గది 1, గ్రౌండ్ ఫ్లోర్. ఉదయం 9 నుండి మధ్యాహ్నం 2 వరకు.",
      "2*2": "END డా. ప్రియా శర్మ - OPD గది 3, గ్రౌండ్ ఫ్లోర్. ఉదయం 10 నుండి మధ్యాహ్నం 1 వరకు.",
      "2*3": "END డా. సురేష్ రావు - OPD గది 4, 1వ అంతస్తు. ఉదయం 9 నుండి మధ్యాహ్నం 12 వరకు.",
      "2*4": "END డా. అనితా సింగ్ - OPD గది 2, గ్రౌండ్ ఫ్లోర్. ఉదయం 9 నుండి మధ్యాహ్నం 1 వరకు.",
      "2*5": "END డా. వినోద్ పటేల్ - OPD గది 5, 1వ అంతస్తు. ఉదయం 11 నుండి మధ్యాహ్నం 2 వరకు.",
      "3": "END ఔషధశాల గ్రౌండ్ ఫ్లోర్‌లో నిర్గమన ద్వారం దగ్గర ఉంది. ఉదయం 8 నుండి రాత్రి 8 వరకు.",
      "4": "END బిల్లింగ్ కౌంటర్ గ్రౌండ్ ఫ్లోర్‌లో ప్రధాన ద్వారానికి ఎడమవైపు ఉంది.",

      "6": "END వీల్‌చైర్ రాంప్ ప్రధాన ద్వారం వద్ద మరియు లిఫ్ట్ రిసెప్షన్ దగ్గర ఉంది.",
      "0": "LANG"
    },
    hindi: {
      main: "CON अस्पताल सहायक में आपका स्वागत है\n\n1. प्रयोगशाला\n2. OPD / डॉक्टर\n3. फार्मेसी\n4. बिलिंग\n5. आपातकाल\n6. दिव्यांग सेवाएं\n0. भाषा बदलें",

      "2*3": "END डॉ. सुरेश राव - OPD कक्ष 4, पहली मंजिल। सुबह 9 से दोपहर 12 बजे तक।",

      "2*5": "END डॉ. विनोद पटेल - OPD कक्ष 5, पहली मंजिल। सुबह 11 से दोपहर 2 बजे तक।",

      "5": "END आपातकाल: इमारत के पीछे जाएं। लाल संकेतों का पालन करें। 24 घंटे खुला।",
      "6": "END व्हीलचेयर रैंप मुख्य प्रवेश द्वार पर और लिफ्ट रिसेप्शन के पास है।",

  const langMenu = "CON Select Language:\n1. English\n2. ಕನ್ನಡ Kannada\n3. తెలుగు Telugu\n4. हिंदी Hindi";

  function startUSSD() {
    currentText = "";
    started = true;
    document.getElementById("screen").innerText = menus[selectedLang].main.replace("CON ", "");
  }

  function press(num) {
    if (!started) {
      document.getElementById("screen").innerText = "Press 📞 to start first!";
      return;
    }

    // Handle language selection screen
    if (document.getElementById("screen").innerText === langMenu.replace("CON ", "")) {
      if (num === "1") { selectedLang = "english"; }
      else if (num === "2") { selectedLang = "kannada"; }
      else if (num === "3") { selectedLang = "telugu"; }
      else if (num === "4") { selectedLang = "hindi"; }
      currentText = "";
      document.getElementById("screen").innerText = menus[selectedLang].main.replace("CON ", "");
      return;
    }

    if (currentText === "") {
      currentText = num;
    } else {
      currentText += "*" + num;
    }

    const response = menus[selectedLang][currentText];

    if (!response) {
      document.getElementById("screen").innerText = "Invalid option. Press CLR and try again.";
      return;
    }

    if (response === "LANG") {
      document.getElementById("screen").innerText = langMenu.replace("CON ", "");
      currentText = "";
      return;
    }

    if (response.startsWith("END")) {
      document.getElementById("screen").innerText = response.replace("END ", "");
      started = false;
      currentText = "";
    } else if (response.startsWith("CON")) {
      document.getElementById("screen").innerText = response.replace("CON ", "");
    }
  }

  function reset() {
    currentText = "";
    started = false;
    selectedLang = "english";
    document.getElementById("screen").innerText = "Press 📞 to start";
  }
</script>
</body>
</html>
